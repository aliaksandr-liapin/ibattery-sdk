# NUCLEO-L476RG + X-NUCLEO-IDB05A1 BLE shield + INA219 + EXTERNAL ADC voltage sense.
#
# Same as nucleo_l476rg_ble_current.conf but battery voltage is read from an
# external resistor divider on Arduino A1 / PA1 (ADC1_IN6) instead of VDD/VREFINT.
# This lets a bench source-measure unit (Nordic PPK2) drive the sensed voltage
# full->empty independently of the MCU supply, so the SoH learning + persistence
# chain can be exercised end-to-end.  Enable SoH to learn capacity from the
# excursion.  See docs/WIRING.md "External ADC voltage sense (PPK2 rig)".
#
# Usage: west build -b nucleo_l476rg app -d build-stm32-extadc --pristine -- \
#   -DSHIELD=x_nucleo_idb05a1 \
#   -DEXTRA_CONF_FILE=boards/nucleo_l476rg_ble_extadc.conf \
#   -DEXTRA_DTC_OVERLAY_FILE=boards/nucleo_l476rg_extadc.overlay \
#   -DZEPHYR_EXTRA_MODULES="/opt/nordic/ncs/v3.2.2/modules/hal/stm32"

# ── BLE transport (board default disables it) ──
CONFIG_BATTERY_TRANSPORT=y
CONFIG_BATTERY_TRANSPORT_BLE=y
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="iBattery-STM32"
CONFIG_SPI=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
# v4 telemetry is 34 bytes; a notification needs ATT_MTU >= 34 + 3 (ATT header).
CONFIG_BT_L2CAP_TX_MTU=37
CONFIG_BT_BUF_ACL_TX_SIZE=41
CONFIG_BT_BUF_ACL_RX_SIZE=41

# ── INA219 current sense + coulomb counting ──
CONFIG_I2C=y
CONFIG_BATTERY_CURRENT_SENSE=y
CONFIG_BATTERY_SOC_COULOMB=y
CONFIG_BATTERY_CAPACITY_MAH=220

# ── External ADC voltage sense (PA1 / A1, 100k/100k divider => ratio 2) ──
CONFIG_BATTERY_VOLTAGE_EXTERNAL_ADC=y
CONFIG_BATTERY_VOLTAGE_DIVIDER_RATIO=2

# ── State of Health (learn capacity from the driven excursion) ──
CONFIG_BATTERY_SOC_SOH=y
