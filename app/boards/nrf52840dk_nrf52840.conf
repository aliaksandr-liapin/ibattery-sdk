# Auto-merged for board nrf52840dk/nrf52840 (Zephyr applies boards/<board>.conf
# automatically, like the sibling nrf52840dk_nrf52840.overlay).
#
# Give the nRF52840-DK a board-specific BLE name so the gateway/Grafana "device"
# tag distinguishes it from the STM32 ("iBattery-STM32") and ESP32-C3
# ("iBattery-ESP32C3") builds. Without this the nRF falls back to prj.conf's
# generic "iBattery".
CONFIG_BT_DEVICE_NAME="iBattery-nRF52840"
