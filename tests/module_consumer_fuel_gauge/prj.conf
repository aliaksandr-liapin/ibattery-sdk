# Enable the SDK and its read-only Zephyr fuel_gauge driver via the module
# Kconfig (Kconfig.ibattery gate). CONFIG_BATTERY_FUEL_GAUGE_API instantiates
# the driver from the "aliaksandr,ibattery-fuel-gauge" DT node (provided by the
# consumer's app.overlay) and pulls in the fuel_gauge subsystem, so the linker
# must resolve the driver + subsystem through the module-consumption path.
CONFIG_BATTERY_SDK=y
CONFIG_BATTERY_FUEL_GAUGE_API=y
