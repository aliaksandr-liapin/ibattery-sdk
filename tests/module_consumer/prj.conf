# Enable the SDK via its module Kconfig (Kconfig.ibattery gate). Defaults give
# the core SDK (CR2032, VREFINT voltage, die temp). The CI build additionally
# passes -DCONFIG_BATTERY_SOC_SOH=y etc. to verify the recently-added options
# are exposed by the module Kconfig and that battery_soh.c links via the module
# CMakeLists.
CONFIG_BATTERY_SDK=y
CONFIG_BATTERY_TEMP_DIE=y
